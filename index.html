<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Streaming Metrics Tester</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>🎬 Streaming Quality Tester</h1>

    <div id="errorDisplay" class="error-message"></div>

    <div class="input-group">
        <label for="emailInput">Email:</label>
        <input type="email" id="emailInput" placeholder="your.email@example.com">
        <button id="testButton" disabled onclick="app.startAllTests()">Start All Tests</button>
    </div>

    <hr class="separator">

    <div class="video-section">
        <div class="video-box">
            <h3>Local Video Test (45s)</h3>
            <video id="localVideo" controls muted preload="auto">
                <source src="bigbunny1.mp4" type="video/mp4"> 
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="video-box">
            <h3>YouTube Video Test (30s)</h3>
            <div id="youtubePlayer"></div>
        </div>
    </div>
    
    <div id="webrtcSummary" class="card summary-card" style="margin-top: 24px;">
        <h2>🎙️ VoIP WebRTC Test Metrics</h2>
        <div id="webrtcResultsContent">
            <p>WebRTC VoIP test metrics will appear here.</p>
        </div>
    </div>

    <div id="summary" class="card summary-card">
        <h2>📊 Video Test Summary</h2>
        <div id="resultsContent">
            <p>Video test results will appear here after the tests are complete.</p>
        </div>
    </div>
</div>

<script src="webrtc_test.js"></script>
<script src="videotest.js"></script>
<script src="orchestrator.js"></script>
</body>
</html>
